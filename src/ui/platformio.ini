[platformio]
boards_dir = boards

[env:T-RGB]
platform = espressif32@6.9.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
    default
build_flags =
    -DLV_CONF_PATH=${PROJECT_DIR}/src/lv_conf.h
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -I${PROJECT_DIR}/../shared
    -DDISPLAY_FLIP=1 ; display is mounted upside down: rotate UI and touch by 180 degrees
lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGo-T-RGB.git
    lvgl/lvgl @ 9.2.2
    lewisxhe/SensorLib @ 0.2.3
    bodmer/TFT_eSPI @ 2.5.43
    moononournation/GFX Library for Arduino @ 1.5.0

; Same firmware, but the controller link runs over USB serial instead of ESP-NOW (for debugging)
[env:T-RGB-serial]
extends = env:T-RGB
build_flags =
    ${env:T-RGB.build_flags}
    -DLINK_USE_SERIAL

; Upload over WiFi (needs one prior USB flash with this firmware)
[env:T-RGB-ota]
extends = env:T-RGB
upload_protocol = espota
upload_port = espresso-display.local ; or the display's IP if mDNS doesn't resolve
upload_flags = --port=3232
