[platformio]
default_envs = release

[env:release]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

lib_deps = 
    br3ttb/PID@^1.2.1
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit MAX31855 library@^1.4.2
    bblanchon/ArduinoJson@^6.21.5
    madleech/Button@^1.0.0

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1    ; Serial output over USB-C
    -DARDUINO_USB_MODE=1           ; Normal USB serial mode
    -DDISABLE_ALL_LIBRARY_WARNINGS ; Suppress library warnings
    ;; Display flags
    ; Use the official LilyGO T-Display S3 setup (8-bit parallel interface)
    -DUSER_SETUP_LOADED=1
    -DUSER_SETUP_ID=206
    -DST7789_DRIVER=1
    -DINIT_SEQUENCE_3=1
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    ; 8-bit parallel pins
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    ; Backlight
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    ; Font loading
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

